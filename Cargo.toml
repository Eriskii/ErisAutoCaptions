[package]
name = "erisautocaptions"
description = "Live captions for anything your Mac is playing or hearing, from the menu bar, on-device"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Eriskii/ErisAutoCaptions"
publish = false

[dependencies]
block2 = "0.6.2"
clap = { version = "4", features = ["derive"] }
dispatch2 = "0.3"
hound = "3.5"
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
